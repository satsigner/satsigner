[package]
name = "satsigner-payjoin"
version = "0.1.0"
edition = "2021"
license = "MIT"

[lib]
crate-type = ["cdylib", "staticlib", "lib"]
name = "satsigner_payjoin"

[dependencies]
base64 = "0.22"
bitcoin = { version = "0.32", features = ["base64"] }
ohttp = { version = "0.6.0", package = "bitcoin-ohttp" }
hex = "0.4"
once_cell = "1"
payjoin = { version = "0.25", features = ["v1", "v2", "io"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
uniffi = { version = "=0.31.0", features = ["tokio"] }
url = "2"
uuid = { version = "1", features = ["v4"] }

[build-dependencies]
uniffi = { version = "=0.31.0", features = ["build"] }

[dev-dependencies]
bip39 = "2"
hex = "0.4"
reqwest = { version = "0.12", default-features = false, features = [
  "blocking",
  "rustls-tls"
] }
serde_json = "1"
