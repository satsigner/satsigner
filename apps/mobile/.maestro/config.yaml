# Shared Maestro config — single source of truth for CLI + Studio.
# Studio: open apps/mobile/.maestro
#
# appId MUST match the variant package installed/open on the device
# (pnpm variant → com.satsigner.satsigner.dev.<suffix>). Override per run with
# APP_ID=… if you switch variants.
appId: com.satsigner.satsigner.dev.feature_payjoin
env:
  ACCOUNT_NAME: 'Sample (segwit)'
  CLOWN_ACCOUNT_NAME: 'Clown'
flows:
  - 'flows/smoke-*.yaml'
  - 'flows/payjoin-*.yaml'
excludeTags:
  - manual
# Prefer run-with-results.sh (writes apps/mobile/.maestro/results/latest).
testOutputDir: results
