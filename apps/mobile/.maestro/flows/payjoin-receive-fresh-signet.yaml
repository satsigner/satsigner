appId: ${APP_ID}
tags:
  - payjoin
  - receive
  - signet
  - fresh
---
# Same as receive — opens existing Sample (segwit) or loads it (no new account).
# Kept as a separate entry for Studio; does not clear state or create wallets.

- runFlow:
    file: shared/launch.yaml
- runFlow:
    file: shared/skip-pin-and-warning.yaml
- runFlow:
    file: shared/open-sample-segwit.yaml
- tapOn:
    id: account-receive
- extendedWaitUntil:
    visible:
      id: receive-payjoin-toggle
    timeout: 20000
- assertVisible: 'Payjoin'
- extendedWaitUntil:
    visible: 'Payjoin ready'
    timeout: 45000
- assertVisible:
    id: receive-payjoin-status
    text: 'Payjoin ready'
- copyTextFrom:
    id: receive-bitcoin-uri
- evalScript: ${output.uri = maestro.copiedText}
- evalScript: ${console.log('PAYJOIN_URI_CAPTURE=' + output.uri)}
- assertTrue: ${output.uri.includes('pj=')}
- assertTrue: ${output.uri.toLowerCase().includes('bitcoin:')}
- tapOn:
    id: receive-copy-uri
