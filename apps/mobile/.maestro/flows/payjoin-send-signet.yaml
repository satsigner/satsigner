appId: ${APP_ID}
tags:
  - payjoin
  - send
  - signet
---
# Send to a Payjoin URI on signet using Sample (segwit) as the funded sender.
# Typical pair: Clown receive (`payjoin-receive-clown-signet`) → this send.
#
# BIP77 async path (from device logs):
#   post original → "Waiting for receiver" (Check / Open accounts)
# Full roundtrip continues in payjoin-clown-finish-receive +
# payjoin-sample-resume-send (see sample-to-clown.sh).
#
#   PAYJOIN_URI='bitcoin:…?pj=…' pnpm maestro:payjoin:send

- runFlow:
    file: shared/launch.yaml
- runFlow:
    file: shared/skip-pin-and-warning.yaml
# If prior receive left us on Payjoin Receive, exit cleanly before Sample send
- runFlow:
    file: shared/leave-to-account-list.yaml
- runFlow:
    file: shared/open-sample-segwit.yaml
- tapOn:
    id: account-send
# List picker: "Select All" is not in the a11y tree — tap a Sample UTXO amount.
- extendedWaitUntil:
    visible: 'SELECT UTXOS TO CONTINUE'
    timeout: 30000
- tapOn: '186,443'
- extendedWaitUntil:
    visible: 'USE 1 UTXO'
    timeout: 15000
- tapOn: 'USE 1 UTXO'
- extendedWaitUntil:
    visible: 'Output'
    timeout: 20000
- tapOn: 'Output'
- extendedWaitUntil:
    visible:
      id: send-output-address
    timeout: 15000
# Do not tapOn placeholder "Address" — on some AVDs that focuses the OS
# stylus / handwriting drawer and steals inputText.
- runFlow:
    when:
      visible: '(?i)Stylus|Handwriting|Writing tools|Scribe'
    commands:
      - back
- tapOn:
    id: send-output-address
- eraseText
- inputText: ${PAYJOIN_URI}
- hideKeyboard
- extendedWaitUntil:
    visible: 'Payjoin invoice detected'
    timeout: 15000
    optional: true
- tapOn:
    id: send-output-label
- eraseText
- inputText: 'maestro-payjoin'
- hideKeyboard
- tapOn: 'Save output'
- tapOn: 'Sign transaction'
- extendedWaitUntil:
    visible: 'Sign transaction'
    timeout: 20000
- tapOn: 'Sign transaction'
# After post: either immediate proposal (broadcast) or async wait for Clown.
- extendedWaitUntil:
    visible: '(?i).*(Waiting for receiver|Check for Payjoin response|broadcast).*'
    timeout: 120000
- runFlow:
    when:
      visible: '(?i)Waiting for receiver|Check for Payjoin response'
    commands:
      - assertVisible: '(?i)Check for Payjoin response'
      - runFlow:
          when:
            visible: '(?i)Expiring in .* min'
          commands:
            - assertVisible: '(?i)Expiring in .* min'
      - assertVisible:
          id: send-payjoin-open-accounts
- runFlow:
    when:
      visible:
        id: send-broadcast
      notVisible: '(?i)Waiting for receiver'
    commands:
      - tapOn:
          id: send-broadcast
      - extendedWaitUntil:
          visible: '(?i).*broadcast.*'
          timeout: 60000
          optional: true
