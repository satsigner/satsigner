appId: ${APP_ID}
tags:
  - payjoin
  - receive
  - signet
  - fresh
---
# Create (or open) ACCOUNT_NAME singlesig on signet, then expose a Payjoin URI.
# Pair with payjoin-send-signet using Sample (segwit) as the funded sender.
#
#   -e ACCOUNT_NAME=pjrecv1

- runFlow:
    file: shared/launch.yaml
- runFlow:
    file: shared/skip-pin-and-warning.yaml
- runFlow:
    file: shared/create-signet-singlesig.yaml
- tapOn:
    id: account-receive
- extendedWaitUntil:
    visible:
      id: receive-payjoin-toggle
    timeout: 20000
- assertVisible: 'Payjoin'
- extendedWaitUntil:
    visible: 'Payjoin ready'
    timeout: 60000
- assertVisible:
    id: receive-payjoin-status
    text: 'Payjoin ready'
- assertVisible:
    id: receive-bitcoin-uri
- copyTextFrom:
    id: receive-bitcoin-uri
- evalScript: ${output.uri = maestro.copiedText}
- evalScript: ${console.log('PAYJOIN_URI_CAPTURE=' + output.uri)}
- assertTrue: ${output.uri.includes('pj=')}
- assertTrue: ${output.uri.toLowerCase().includes('bitcoin:')}
- tapOn:
    id: receive-copy-uri
