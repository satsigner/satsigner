packages:
  - 'apps/*'
  - 'packages/*'
  - 'tools/*'

# Hoist all packages to root node_modules — required for React Native / Metro
shamefullyHoist: true
# Use hoisted node-linker so packages are physically at node_modules/<pkg> (avoids Windows path length issues with CMake)
nodeLinker: hoisted
# Don't fail on peer dependency mismatches (React Native ecosystem has many)
strictPeerDependencies: false

allowBuilds:
  '@parcel/watcher': false
  '@secondts/bark-react-native': true
  '@shopify/react-native-skia': true
  esbuild: true
  react-native-bdk-sdk: true
  react-native-payjoin: true
  sharp: true
  unrs-resolver: false
  workerd: true

overrides:
  '@expo/dom-webview': 58.0.2
  '@expo/metro-runtime': 58.0.15
  '@types/react': 19.3.0
  react: 19.3.0
  react-dom: 19.3.0
patchedDependencies:
  '@ubjs/core@0.31.0-5': patches/@ubjs__core@0.31.0-5.patch
  expo-screen-capture@58.0.6: patches/expo-screen-capture@58.0.6.patch
  react-native-bdk-sdk@0.8.0: patches/react-native-bdk-sdk@0.8.0.patch
  react-native-draggable-flatlist@4.0.3: patches/react-native-draggable-flatlist@4.0.3.patch
  react-native-tcp-socket@6.4.1: patches/react-native-tcp-socket@6.4.1.patch
